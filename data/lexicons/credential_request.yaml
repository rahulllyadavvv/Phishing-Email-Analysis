# Credential requests: asks for passwords, codes or account verification.
finding_id: credential_request
severity: high
cap: 5
phrases:
  - verify your account
  - verify your identity
  - confirm your account
  - confirm your identity
  - confirm your password
  - reset your password
  - update your password
  - validate your account
  - login to
  - log in to
  - sign in to
  - enter your password
  - enter your credentials
  - one-time password
  - otp
  - security code
  - verification code
  - kyc update
  - update your kyc
  - otp share karein
  - apna password
  - पासवर्ड
patterns:
  - "(enter|provide|confirm|verify|update|share|send)\\s+(your\\s+)?(password|passcode|pin|otp|credentials|login\\s+details|username\\s+and\\s+password)"
  - "(password|credentials?)\\s+(expire[sd]?|expiring)"
  - "click\\s+(here|below|the\\s+link)\\s+to\\s+(verify|confirm|log\\s*in|sign\\s*in|reset|unlock)"
