# Commonly impersonated brands.
#
# To add a brand, append an entry under "brands":
#   name:               display name used in findings
#   keywords:           lowercase words/phrases that claim the brand (matched as whole words in
#                       display names, subjects and bodies). Avoid very generic words.
#   legitimate_domains: registered domains the brand really sends from / links to. Subdomains
#                       are covered automatically (accounts.google.com matches google.com).
#   esp_domains:        bulk email providers the brand is known to send through (optional).
#
# "organization" lists your own company's domains, so mail claiming to be from your own
# organization can be checked the same way. Leave it empty if not needed.

organization:
  name: ""
  domains: []

brands:
  - name: Microsoft
    keywords: [microsoft, office 365, office365, microsoft 365, onedrive, sharepoint, outlook, microsoft teams, azure, xbox]
    legitimate_domains: [microsoft.com, microsoftonline.com, office.com, office365.com, microsoft365.com, outlook.com, live.com, hotmail.com, sharepoint.com, onedrive.com, azure.com, xbox.com, skype.com, msn.com, bing.com, windows.com]
    esp_domains: []
  - name: Google
    keywords: [google, gmail, google drive, google docs, youtube]
    legitimate_domains: [google.com, gmail.com, googlemail.com, youtube.com, withgoogle.com, google.co.in]
    esp_domains: []
