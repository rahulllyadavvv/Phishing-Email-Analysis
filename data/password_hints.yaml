# Words that introduce an archive or document password in an email body, and words that follow
# them but are not the password ("the password for the file is 4455"). After each hint word, the
# first token (within max_tokens) that is not a stopword or hint word is a password candidate.
# Add lowercase hint words (any language) or stopwords.
max_tokens: 6
hints: [password, passwd, pass, pwd, passcode, pin, code, kennwort, contraseña, "mot de passe", पासवर्ड]
stopwords: [is, the, for, to, of, a, an, and, or, your, this, that, file, files, archive, zip, attachment, attached, document, below, above, use, using, please, open, it, will, be, required, needed, protected, same, as, with, our, code, pin, password]
