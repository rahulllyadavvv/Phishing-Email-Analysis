# Scoring weights for the rule-based scorer (phishlens/scoring/rule_scorer.py).
#
# weights: points per finding ID. A number, or a map by severity for findings whose severity
#   varies ({critical: 50, high: 35, medium: 15}); a severity missing from the map uses the
#   severity fallback. Findings not listed use the severity fallback.
#   Scaling applied in code:
#   - tone findings with evidence.counted / evidence.cap: weight x (0.5 + 0.5 x counted / cap)
#   - findings with evidence.probability (ML): weight x probability
#   - findings downgraded by a trusted ARC forward (evidence.downgraded_by): severity fallback
# severity_fallback: points by severity when no weight is given.
# module_caps: the most points one module can contribute.
# thresholds: score from which a case is suspicious / malicious, per case type.
# overrides: rules that force a minimum label. Condition: any_of (one finding), all_of (every
#   finding) or min_severity (any finding at or above it). The score is raised to at least the
#   threshold of the forced label.
# confidence: key reputation services; each one not configured lowers confidence.
# Finding IDs are stable: never rename one here without renaming it in the code (CLAUDE.md).

severity_fallback: {info: 0, low: 5, medium: 15, high: 30, critical: 50}

module_caps:
  header: 60
  domain: 50
  urls: 60
  attachments: 70
  artifacts: 25
  tone: 30

thresholds:
  email: {suspicious: 30, malicious: 60}
  file: {suspicious: 20, malicious: 50}

overrides:
  - {name: known_malicious_attachment, label: malicious, any_of: [attachment_known_malicious]}
  - {name: known_malicious_url, label: malicious, any_of: [url_known_malicious]}
  - {name: sandbox_malicious, label: malicious, any_of: [sandbox_malicious]}
  - {name: html_smuggling, label: malicious, any_of: [html_smuggling]}
  - {name: spoofed_brand, label: malicious, all_of: [auth_but_unaligned, brand_impersonation]}
  - {name: critical_finding, label: suspicious, min_severity: critical}

confidence:
  key_services: [virustotal, google_safebrowsing, abusech]
  penalty_per_missing_service: 0.1
  max_service_penalty: 0.3
  minimum: 0.1

